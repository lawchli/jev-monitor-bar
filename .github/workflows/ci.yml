name: ci

# 私有仓库的 Actions 分钟有限（macOS 按 10 倍、Windows 按 2 倍计）。
# push 只在 main 上跑，PR 只跑 pull_request，避免同一提交跑两遍；同一分支的新提交取消旧运行。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 最低与最新版本在 Linux 上都跑；Windows 与 macOS 只跑最低版本，行为差异主要来自平台而不是小版本。
          - {os: ubuntu-latest, python: '3.9'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.9'}
          - {os: macos-latest, python: '3.9'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s python/tests -v
